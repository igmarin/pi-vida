# Install sources for profile allowlist names. Consumed by `just skills`
# (scripts/skills-bootstrap.ts), which clones each repo into
# ${PI_VIDA_REPOS:-~/.local/share/pi-vida/repos} and symlinks skills into
# ${PI_SKILLS_HOME:-~/.agents/skills}, then writes .dotskills-manifest.json.
#
# packs:  allowlisted pack name -> owner/repo. Every skills/*/SKILL.md in the
#         repo is linked and recorded under "<pack>:<skill>" in the manifest.
# skills: individual allowlisted name (mantra/tracker) -> owner/repo. Only
#         skills/<name>/ is linked. Needed when the skill lives inside a pack
#         repo but the pack itself is not allowlisted by every vida, or when
#         the skill comes from a third-party repo.
packs:
  agnostic-planning-skills: igmarin/agnostic-planning-skills
  ruby-core-skills: igmarin/ruby-core-skills
  rails-agent-skills: igmarin/rails-agent-skills
  rust-core-skills: igmarin/rust-core-skills
  elixir-phoenix-skills: igmarin/elixir-phoenix-skills
skills:
  i-have-adhd: ayghri/i-have-adhd
  ponytail: dietrichgebert/ponytail
  ponytail-review: dietrichgebert/ponytail
  deslop: owainlewis/agent-skills
  clarify: owainlewis/agent-skills
  requirements-clarifier: igmarin/agnostic-planning-skills
  tdd: igmarin/elixir-phoenix-skills
  herdr: herdrdev/herdr
  github-issue: igmarin/agnostic-planning-skills
